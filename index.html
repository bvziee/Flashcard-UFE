  <head>
    <meta charset="UTF-8" />

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Inter:wght@400;600;700&family=Lato:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&family=Noto+Sans+Mongolian&family=Open+Sans:wght@400;700&family=Oswald:wght@400;700&family=Playfair+Display:wght@400;700&family=Roboto:wght@400;700&family=Marck+Script&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
      body {
        font-family: 'Segoe UI', 'Inter', 'Noto Sans Mongolian', sans-serif;
        /* Vista-esque Default Background if image fails */
        background: rgb(2,0,36);
        background: linear-gradient(160deg, rgba(2,0,36,1) 0%, rgba(9,75,121,1) 35%, rgba(0,212,255,1) 100%);
        margin: 0;
        overflow: hidden; /* Prevent body scroll, handle in window */
      }
      
      /* Custom Scrollbar for the Vista feel */
      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #f0f0f0;
        border-left: 1px solid #dcdcdc;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #c2c2c2;
        border: 1px solid #fff;
        border-radius: 6px;
        box-shadow: inset 1px 0 0 #f0f0f0;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #a8a8a8;
      }

      /* Perspective for card flip */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }

      /* Animation Keyframes */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
